worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    charset utf-8;
    sendfile on;
    server_tokens off;

    gzip on;
    gzip_static on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    client_max_body_size 100m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream calmadmin_backend {
        # 前后端部署在同一台服务器，后端无需暴露给外部网络。
        server 127.0.0.1:8087;
        keepalive 16;
    }

    server {
        # 生产用户通过 http://10.148.201.223:8086 访问前端。
        listen 8086;
        server_name 10.148.201.223 10.148.53.30 localhost;

        # pnpm build 后，将 dist 目录内容发布到此位置。
        root D:/deploy/calmadmin/dist;
        index index.html;

        access_log logs/calmadmin-access.log;
        error_log  logs/calmadmin-error.log warn;

        # 入口文件不使用强缓存，避免发布后仍加载旧版本。
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files $uri =404;
        }

        # 运行时 API 配置需要在发布后随时可调整，禁止浏览器缓存。
        location = /runtime-config.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files $uri =404;
        }

        # 带前端公共前缀的 HTTP API。转发时移除 /xxtdxm，后端仍接收 /api/...
        location ^~ /xxtdxm/api/ {
            proxy_pass http://calmadmin_backend/api/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # 兼容旧版未带公共前缀的 HTTP API。
        location ^~ /api/ {
            proxy_pass http://calmadmin_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # 带前端公共前缀的 WebSocket。转发时移除 /xxtdxm，后端仍接收 /ws/...
        location ^~ /xxtdxm/ws/ {
            proxy_pass http://calmadmin_backend/ws/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 兼容旧版未带公共前缀的 WebSocket，例如 /ws/agent。
        location ^~ /ws/ {
            proxy_pass http://calmadmin_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Vite 构建生成带哈希的静态资源，可使用长期缓存。
        location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # 支持 Vue Router history 模式，刷新业务页面时返回前端入口。
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
